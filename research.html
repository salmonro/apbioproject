<!DOCTYPE html>
<html>

<head>
  <title>Research</title>
  <link rel="stylesheet" href="style.css">

  <style>

    body {
      margin: 0;
      font-family: 'Rubik', Arial, sans-serif;
      text-align: center;
      color: white;

      background:
        radial-gradient(circle at 20% 25%, rgba(7,56,6,0.7) 0%, transparent 40%),
        radial-gradient(circle at 80% 75%, rgba(26,42,74,0.7) 0%, transparent 45%),
        radial-gradient(circle at 50% 90%, rgba(28,59,33,0.6) 0%, transparent 40%),
        linear-gradient(180deg, #0b0d18 0%, #05060c 100%);

      min-height: 100vh;
      padding-top: 0px;
      overflow-x: hidden;
    }

    /* floating glow */
    body::before,
    body::after {
      content: "";
      position: fixed;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      filter: blur(120px);
      z-index: -1;
      opacity: 0.25;
      animation: floatGlow 14s ease-in-out infinite alternate;
    }

    body::before {
      background: #2cff7a;
      top: -100px;
      left: -100px;
    }

    body::after {
      background: #3b82f6;
      bottom: -120px;
      right: -120px;
      animation: floatGlow 18s ease-in-out infinite alternate-reverse;
    }

    @keyframes floatGlow {
      from { transform: translateY(0px) scale(1); }
      to { transform: translateY(40px) scale(1.1); }
    }

    /* TITLE */
    h1 {
      font-size: 72px;
      margin-bottom: 40px;

      background: linear-gradient(to right, #daffd6, #75ed69, #40c433);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;

      text-shadow:
        0 0 8px rgba(55, 214, 88, 0.8),
        0 0 18px rgba(55, 214, 88, 0.6),
        0 0 32px rgba(55, 214, 88, 0.4);

      animation: fadeInUp 0.8s ease forwards;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(25px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* IMAGE STRIP (NOW HERO STYLE) */
    .image-strip {
      width: 92%;
      margin: 20px auto 80px auto;

      display: flex;
      justify-content: center;
      gap: 24px;
      flex-wrap: wrap;
    }

    .image-item {
      position: relative;
    }

    /* BIGGER IMAGES */
    .image-item img {
      width: 280px;
      height: 200px;
      object-fit: cover;

      border-radius: 16px;

      border: 1px solid rgba(255,255,255,0.12);

      box-shadow: 0 0 22px rgba(55, 214, 88, 0.22);

      transition: all 0.3s ease;
    }

    .image-item img:hover {
      transform: translateY(-8px) scale(1.05);
      box-shadow: 0 0 35px rgba(55, 214, 88, 0.4);
    }

    /* BLUE REFERENCE NUMBERS */
    .ref-num {
      position: absolute;
      top: 8px;
      left: 8px;

      width: 26px;
      height: 26px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background: rgba(90, 170, 255, 0.92);
      color: white;

      font-size: 12px;
      font-weight: bold;

      text-decoration: none;

      box-shadow: 0 0 12px rgba(90,170,255,0.6);

      transition: all 0.2s ease;
    }

    .ref-num:hover {
      transform: scale(1.15);
      background: rgba(120, 200, 255, 1);
      box-shadow: 0 0 18px rgba(120,200,255,0.9);
    }

    /* DOC BOX */
    .doc-box {
      width: 78%;
      margin: auto auto 120px auto;

      padding: 40px;

      background: rgba(255,255,255,0.05);
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.08);

      backdrop-filter: blur(14px);

      animation: fadeInUp 1s ease forwards;
    }

    .doc-box a {
      display: inline-block;

      margin-top: 20px;
      padding: 14px 28px;

      background: #75ed69;
      color: white;

      font-weight: bold;
      text-decoration: none;

      border-radius: 10px;

      box-shadow: 0 0 18px rgba(55,214,88,0.5);

      transition: all 0.3s;
    }

    .doc-box a:hover {
      transform: translateY(-4px);
      box-shadow: 0 0 28px rgba(55,214,88,0.9);
    }

  </style>
</head>
